<!DOCTYPE html>
<html>
<head>
  <title>Quiz Game</title>
</head>
<body>
  <h1>Quiz Game 🎮</h1>
  <form method="POST">
    {% for q in questions %}
      <p>{{ loop.index }}. {{ q.question }}</p>
      {% for i, q in enumerate(questions, 1) %}
  <p>{{ i }}. {{ q.question }}</p>
  {% for opt_index, opt in enumerate(q.options, 1) %}
    <input type="radio" name="q{{ i }}" value="{{ opt_index }}"> {{ opt }}<br>
  {% endfor %}
{% endfor %}
<button type="submit">Submit</button>

  </form>
</body>
</html>
