<!DOCTYPE html>
<html>
<head>
  <title>Quiz Game</title>
</head>
<body>
  <h1>Quiz Game</h1>
  <form method="POST">
    {% for q in questions %}
      <p>{{ loop.index }}. {{ q.question }}</p>
      {% for opt in q.options %}
        <input type="radio" name="q{{ loop.index }}" value="{{ loop.index0 + 1 }}"> {{ opt }}<br>
      {% endfor %}
    {% endfor %}
    <button type="submit">Submit</button>
  </form>
</body>
</html>
